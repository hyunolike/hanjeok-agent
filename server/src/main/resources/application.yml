hermes:
  hanjeok:
    # 기본값을 두지 않는다 — 그럴듯한 플레이스홀더(과거 https://api.hanjeok.example)는
    # HANJEOK_BASE_URL 을 빼먹은 운영자에게 깨끗한 기동과 통과하는 헬스체크를 준 뒤,
    # 첫 요청에서야 실제 백엔드 장애와 구분되지 않는 실패를 안겨준다. 기본값이 없으면
    # 이 프로퍼티를 바인딩하는 순간 이름을 지목한 에러로 기동이 실패한다 — 로컬
    # 실행에도 이 값을 명시적으로 넘겨야 하는 불편은 의도한 대가다.
    base-url: ${HANJEOK_BASE_URL}
    radius-km: 15
    timeout-seconds: 5
  llm:
    # 하네스(`./gradlew eval <provider>`)와 같은 이름을 쓴다 — 잰 것을 그대로 띄우기
    # 위해서다. 모르는 이름은 조용히 기본값으로 떨어지지 않고 기동을 멈춘다.
    provider: ${HERMES_LLM_PROVIDER:anthropic}
    model: ${HERMES_LLM_MODEL:claude-opus-5}
  retrieval:
    mode: ${HERMES_RETRIEVAL_MODE:FULL}
    url: ${HERMES_RETRIEVAL_URL:}
    index-version: ${HERMES_RETRIEVAL_INDEX_VERSION:}
    model-revision: ${HERMES_RETRIEVAL_MODEL_REVISION:}
    auth-mode: ${HERMES_RETRIEVAL_AUTH_MODE:cloud-run-iam}
  cors:
    allowed-origins: ${HERMES_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  demo:
    courses: ${HERMES_DEMO_COURSES:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# 실패 본문은 { "code": "EXPLANATION_UNAVAILABLE" } 뿐이어야 한다 — 사유 문자열은
# 모델이 거부한 텍스트를 담을 수 있다. 이 4개 설정은 스프링 부트 기본값과
# 이미 같지만(그래서 이 파일이 없어도 새지는 않았다), 이 파일을 만드는 지금부터는
# "우연히 안전함"이 아니라 "명시적으로 강제함"이어야 한다.
#
# 접두사는 server.error 가 아니라 spring.web.error 다 — 이 프로젝트의 스프링 부트
# 4.1 에서 ErrorProperties 는 ServerProperties(접두사 server) 가 아니라
# WebProperties(접두사 spring.web) 에 중첩되어 바인딩된다(ErrorMvcAutoConfiguration
# .basicErrorController 가 BasicErrorController 를 this.webProperties.getError()
# 로 생성하는 것으로 실측 확인, spring-boot-web-server:4.1.0 소스의
# ServerProperties 에는 error 필드 자체가 없다). server.error.* 로 썼던 첫 버전은
# 조용히 아무 필드에도 안 묶여 무시됐다 — 실측 없이 Boot 3 시절 관례를 그대로
# 옮겨 적은 값이었다. ErrorResponseOpacityTest 의 뮤테이션 검증(include-message
# 를 always 로 바꿔 실패를 재현)은 이 접두사로 고쳐야만 실제로 통한다.
spring:
  web:
    error:
      include-exception: false
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
