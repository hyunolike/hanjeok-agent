[project]
name = "bench"
version = "0.1.0"
description = "Does retrieval beat prompting the whole corpus, and at what size?"
requires-python = ">=3.13"

# Lower bounds only. Exact versions live in uv.lock, which is committed — pinning
# twice means the two disagree the first time one is bumped.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-neo4j>=0.1",
    "neo4j>=5.25",
    "ragas>=0.2",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    # Not used directly — ragas 0.4.3 imports `langchain_community.chat_models
    # .vertexai` at module load, and langchain-community 0.4 removed it while
    # being sunset in favour of standalone integration packages. Without this
    # ceiling, importing ragas at all raises ModuleNotFoundError. The rest of
    # the stack stays on the 1.x line; only this one package is held back.
    # Revisit when ragas stops importing from the sunset package.
    "langchain-community<0.4",
]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# A bare `uv run pytest` must need no Docker, no network and no API key. The
# constitution keeps paid evaluation out of CI, and a default suite that reaches
# a service drags it straight back in — so the two expensive marks are
# deselected here rather than in a CI flag someone can forget.
addopts = "-m 'not integration and not costly'"
markers = [
    "integration: needs Neo4j running (docker compose up -d neo4j)",
    "costly: calls a paid model; never runs in CI",
]
