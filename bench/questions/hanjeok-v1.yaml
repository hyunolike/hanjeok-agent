# Sixty questions over the real Hanjeok export (2026-10-14), ten of each kind.
# Written from the graph by a script: every place id in `needs` exists in that export.
# {+N} is N days after the day the evaluation runs.
# multi_place questions name a region among the first five places Hanjeok links to the place,
# preferring a region other than its own, so finding them takes following the links.
id: hanjeok-v1
version: 2
questions:
- id: q01
  kind: place_lookup
  expect: answered
  question: 경복궁은 {+2}에 얼마나 붐벼?
  needs:
  - hanjeok:congestion/653@{+2}
