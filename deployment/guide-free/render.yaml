services:
  - type: web
    name: hanjeok-guide
    runtime: docker
    plan: free
    dockerfilePath: ./bench/Dockerfile.api
    dockerContext: ./bench
    healthCheckPath: /guide/ready
    envVars:
      - key: GUIDE_CORS_ALLOWED_ORIGINS
        value: https://agent.hanjeok.com
      - key: GUIDE_LIVE_MODE
        value: live
      - key: HANJEOK_BASE_URL
        value: https://api.hanjeok.com
      - key: GUIDE_TRUST_PROXY
        value: "1"
      - key: GUIDE_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: BENCH_NEO4J_URI
        sync: false
      - key: BENCH_NEO4J_USER
        sync: false
      - key: BENCH_NEO4J_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
