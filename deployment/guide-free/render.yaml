services:
  - type: web
    name: hanjeok-guide
    runtime: docker
    plan: free
    dockerfilePath: ./bench/Dockerfile.api
    dockerContext: ./bench
    healthCheckPath: /guide/ready
    envVars:
      - key: GUIDE_CORS_ALLOWED_ORIGINS
        value: https://agent.hanjeok.com,https://hanjeok.com
      - key: GUIDE_LIVE_MODE
        value: live
      - key: GUIDE_STORE
        value: sqlite
      - key: HANJEOK_BASE_URL
        value: https://api.hanjeok.com
      - key: BENCH_ANSWER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: GUIDE_TRUST_PROXY
        value: "1"
      - key: GUIDE_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: NVIDIA_API_KEY
        sync: false
