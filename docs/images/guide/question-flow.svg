<text x="1146" y="526" font-size="17" font-weight="400" fill="#172033" text-anchor="start" data-label="every citation was fetched for this question"><tspan x="1146" y="526">every citation was </tspan><tspan x="1146" y="552">fetched for this question</tspan></text>
<rect x="1394" y="410" width="166" height="188" rx="17" fill="#FFFFFF" stroke="#172033" stroke-width="1.7"/>
