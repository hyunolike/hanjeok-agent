<text x="886" y="526" font-size="16.5" font-weight="400" fill="#172033" text-anchor="start" data-label="model, lookups withdrawn"><tspan x="886" y="526">model, lookups </tspan><tspan x="886" y="552">withdrawn</tspan></text>
<rect x="1128" y="410" width="222" height="188" rx="17" fill="#FFFFFF" stroke="#172033" stroke-width="1.7"/>
