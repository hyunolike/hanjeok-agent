<text x="608" y="489" font-size="25" font-weight="700" fill="#172033" text-anchor="start">Choose a lookup</text>
<text x="608" y="526" font-size="17" font-weight="400" fill="#172033" text-anchor="start" data-label="model picks one of 7 · at most 3 rounds"><tspan x="608" y="526">model picks one of 7 · </tspan><tspan x="608" y="552">at most 3 rounds</tspan></text>
<rect x="868" y="410" width="216" height="188" rx="17" fill="#FFFFFF" stroke="#172033" stroke-width="1.7"/>
