<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">What happens to one question</title><desc id="desc">Six steps from a question to a verified answer, with rule-based exits, validated lookup execution, and one citation repair.</desc><defs>
