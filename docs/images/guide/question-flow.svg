<text x="1412" y="489" font-size="25" font-weight="700" fill="#172033" text-anchor="start" data-label="Answer + citations + path"><tspan x="1412" y="489">Answer + </tspan><tspan x="1412" y="521">citations + </tspan><tspan x="1412" y="553">path</tspan></text>
<rect x="64" y="714" width="260" height="130" rx="17" fill="#FFF5F3" stroke="#F04B3E" stroke-width="1.7"/>
