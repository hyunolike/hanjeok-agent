<rect x="32" y="920" width="1536" height="58" rx="12" fill="#EEF1F5" stroke="none" stroke-width="1.7"/>
<text x="800" y="956" font-size="19" font-weight="500" fill="#172033" text-anchor="middle">Budget: 3 lookup rounds, 1 answer, 1 repair — 60 seconds. Unverified text never reaches the screen.</text>
