<text x="82" y="789" font-size="17" font-weight="400" fill="#172033" text-anchor="start" data-label="prices, hours, &#x27;reorder the ranking&#x27;…"><tspan x="82" y="789">prices, hours, </tspan><tspan x="82" y="815">&#x27;reorder the ranking&#x27;…</tspan></text>
