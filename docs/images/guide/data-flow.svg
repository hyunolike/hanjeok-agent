<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">한적 에이전트는 데이터를 어떻게 가져오나</title>
<desc id="desc">한적 에이전트는 한적 DB에 직접 접속하지 않습니다. 내보낸 공개 관광 파일을 검증해 Neo4j에 저장하고, 질문에 따라 한적 API를 읽기 전용으로 조회합니다.</desc>
