name: release

# main 의 build 가 통과한 뒤에만 돈다. 두 가지를 한다.
#
# 1. release-please 가 Conventional Commits 를 읽어 릴리즈 PR 을 만들거나 고친다.
# 2. 그 릴리즈 PR 이 머지되면 태그(vX.Y.Z)와 GitHub Release 를 만들고, 그 커밋으로
#    `production` 브랜치를 옮긴다. Render 는 `production` 만 보고 자동 배포한다.
#
# 배포 키나 deploy hook 을 GitHub 에 두지 않는다. 이 워크플로가 하는 일은 브랜치
# 하나를 옮기는 것뿐이라, 새는 것은 「어느 커밋이 운영인가」 하나다.
# 손으로 되돌릴 때는 `git push --force origin <이전 태그>:production`.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # build 가 끝나기 전에 main 이 또 움직였으면 이번 차례는 건너뛴다.
      # release-please 는 main 의 끝을 읽으므로, 검사가 안 끝난 커밋을 릴리즈하게 된다.
      # 뒤의 커밋의 build 가 끝나면 그 차례에 다시 돈다.
      - name: Is the checked commit still main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED: ${{ github.event.workflow_run.head_sha }}
        run: |
          main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" -q .sha)
          if [ "$main" = "$CHECKED" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved on to $main after $CHECKED was checked; skipping."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release PR and GitHub Release
        id: rp
        if: steps.head.outputs.current == 'true'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Move production to the release
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.rp.outputs.sha }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          # 브랜치가 없으면 만들고, 있으면 그 릴리즈 커밋으로 옮긴다.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/production" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/production" -f sha="$SHA" -F force=true
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/heads/production -f sha="$SHA"
          fi
          echo "production -> $TAG ($SHA). Render deploys it."
