name: build

on:
  push:
    branches: [main]
  pull_request:

# 평가(`./gradlew eval`)는 여기서 절대 돌지 않는다. 실제 API 를 부르므로 돈이 들고
# 결과가 비결정적이라, CI 의 통과/실패에 섞이면 요금과 신호가 동시에 망가진다.
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 위키를 체크아웃해 번들을 다시 만든다. 커밋된 번들과 다르면 실패시킨다 —
      # 위키가 바뀌었는데 레포의 번들이 옛것이면, 화면이 보여 주는 근거와 모델이
      # 실제로 본 근거가 갈라진다. 그 갈라짐은 조용하고, 이 프로젝트가 막으려는
      # 것이 정확히 그런 침묵이다.
      - name: Check out the wiki
        uses: actions/checkout@v5
        with:
          repository: hyunolike/travel-context-wiki
          # Source-version generator/sidecar contract is merged; pin the verified wiki main.
          ref: 7fc19c0c4a034868866bcf5a920e3f82050830c7
          fetch-depth: 0
          path: wiki

      - name: Rebuild the bundle from the wiki
        working-directory: wiki
        run: |
          ./scripts/build-bundle.sh hanjeok > "$RUNNER_TEMP/hanjeok-bundle.txt"
          python3 scripts/provenance.py metadata hanjeok > "$RUNNER_TEMP/hanjeok-bundle.meta.json"

      - name: Fail if the committed bundle has drifted
        run: |
          if ! diff -q "$RUNNER_TEMP/hanjeok-bundle.txt" \
                       server/src/main/resources/prompts/hanjeok-bundle.txt > /dev/null; then
            echo "::error::The committed bundle differs from what the wiki produces now."
            echo "Rebuild it: ./scripts/build-bundle.sh hanjeok > <this repo>/server/src/main/resources/prompts/hanjeok-bundle.txt"
            diff "$RUNNER_TEMP/hanjeok-bundle.txt" \
                 server/src/main/resources/prompts/hanjeok-bundle.txt | head -40
            exit 1
          fi

      - name: Fail if bundle provenance has drifted
        run: diff -u "$RUNNER_TEMP/hanjeok-bundle.meta.json" server/src/main/resources/prompts/hanjeok-bundle.meta.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 단위 테스트는 네트워크도 API 키도 요구하지 않는다. 요구하게 되는 순간
      # CI 가 외부 서비스의 가용성에 묶인다.
      - name: Test
        run: ./gradlew build

      - name: Build the image
        run: docker build -t hermes-agent:${{ github.sha }} .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # 백엔드 없이 빌드된다는 것 자체가 검사 대상이다 — 프론트 배포가 서버 기동에
      # 묶이면 안 되고, 첫 프로덕션 빌드가 실제로 그 이유로 죽은 적이 있다.
      - run: pnpm build
